repos:
- repo: https://github.com/asottile/pyupgrade
  rev: v3.22.0
  hooks:
    - id: pyupgrade
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.2
  hooks:
    - id: commitizen
    - id: commitizen-branch
      stages:
        - manual 
- repo: https://github.com/pycqa/isort
  rev: 10.0.0b1
  hooks:
    - id: isort
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.10.1 
  hooks:
    - id: black
